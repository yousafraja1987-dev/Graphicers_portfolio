<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Graphic Design Portfolio</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0b0b0b;
    color:white;
}

/* Header */

header{
    padding:40px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:800;
}

.logo span{
    color:#d4af37;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
}


/* Hero */

.hero{
    padding:80px 8%;
    text-align:center;
}

.hero h1{
    font-size:55px;
}

.hero h1 span{
    color:#d4af37;
}

.hero p{
    margin-top:20px;
    color:#bbb;
    font-size:20px;
}


/* Portfolio */

.portfolio{
    padding:50px 8%;
}

.portfolio h2{
    text-align:center;
    font-size:35px;
    margin-bottom:40px;
}


.gallery{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;

}


.card{

    background:#151515;
    border-radius:15px;
    overflow:hidden;
    transition:.3s;

}


.card:hover{

    transform:translateY(-10px);

}


.card img{

    width:100%;
    height:350px;
    object-fit:cover;

}


.card h3{

    padding:20px;
    text-align:center;

}


/* Footer */

footer{

    text-align:center;
    padding:30px;
    color:#aaa;

}

</style>

</head>


<body>


<header>

<div class="logo">
Yousaf <span>Designs</span>
</div>


<nav>

<a href="#">Home</a>
<a href="#work">Work</a>
<a href="#">Contact</a>

</nav>


</header>



<section class="hero">

<h1>
Creative <span>Graphic Designer</span>
</h1>

<p>
Luxury Product Posters | Social Media Designs | Brand Visuals
</p>

</section>




<section class="portfolio" id="work">


<h2>
My Portfolio
</h2>



<div class="gallery">


<div class="card">

<img src="YSL%20BAG.jpg">

<h3>
Luxury Bag Poster
</h3>

</div>




<div class="card">

<img src="new.jpg">

<h3>
Product Advertisement
</h3>

</div>




<div class="card">

<img src="hydra%20mask.psd">

<h3>
Beauty Product Design
</h3>

</div>



</div>


</section>



<footer>

© 2026 Yousaf Designs | Graphic Designer Portfolio

</footer>



</body>
</html>
